<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Creator Space</title>
  <meta name="description" content="Creator Space — artwork, fan art, merchandise, Roblox 3D services, and community.">
  <style>
    :root{color-scheme:dark;--bg:#0d0d12;--panel:#171720;--text:#f4f2fa;--muted:#aaa7b7;--accent:#c5a5ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#30213e 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);padding:clamp(28px,6vw,64px);border:1px solid #ffffff20;border-radius:28px;background:#171720d9;box-shadow:0 24px 90px #0008}
    .eyebrow{color:var(--accent);letter-spacing:.16em;text-transform:uppercase;font-size:.75rem;font-weight:700}h1{font-size:clamp(2.5rem,8vw,5rem);line-height:1.02;margin:.5rem 0 1rem}p{color:var(--muted);max-width:58ch}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.btn{display:inline-block;padding:12px 18px;border-radius:999px;background:var(--accent);color:#171020;text-decoration:none;font-weight:700}.btn.secondary{background:transparent;color:var(--text);border:1px solid #ffffff35}footer{border-top:1px solid #ffffff20;padding-top:18px;color:var(--muted);font-size:.9rem}footer a{color:var(--accent);margin-right:16px}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">A creator's little universe</div>
  <h1>Creator<br>Space.</h1>
  <p>Artwork, fan art, community notes, merchandise, and Roblox 3D services — all in one place.</p>
  <div class="actions">
    <!-- Replace this URL with the deployed Apps Script /exec URL. -->
    <a class="btn" id="openApp" href="https://script.google.com/macros/s/AKfycbwSiyaXqVj-Fs2f6yT1i-vjRyJ2Ki6V9RezFwMoFtfukvGB6nStSqnqZhuT3ZDI-F4-/exec">Open Creator Space</a>
    <a class="btn secondary" href="pages/privacy.html">Privacy Policy</a>
  </div>
  <footer><a href="pages/terms.html">Terms of Service</a><a href="pages/privacy.html">Privacy Policy</a></footer>
</main>
<script>
  // Replace with the deployed Apps Script web app URL ending in /exec.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwSiyaXqVj-Fs2f6yT1i-vjRyJ2Ki6V9RezFwMoFtfukvGB6nStSqnqZhuT3ZDI-F4-/exec';
  document.getElementById('openApp').href = APPS_SCRIPT_URL;
</script>
</body></html>
